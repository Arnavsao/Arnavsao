<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 328" width="860" height="328">
  <defs>
    <linearGradient id="boostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF73FA">
        <animate attributeName="stop-color" values="#FF73FA;#8B5CF6;#5865F2;#FF73FA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#5865F2">
        <animate attributeName="stop-color" values="#5865F2;#FF73FA;#8B5CF6;#5865F2" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <style>
    @keyframes popIn { 0% { opacity:0; transform:scale(.7); } 70% { opacity:1; transform:scale(1.05); } 100% { opacity:1; transform:scale(1); } }
    .tile-0 { opacity:0; transform-origin:center; transform-box:fill-box; animation: popIn .45s ease-out 0.20s forwards; }
    .tile-1 { opacity:0; transform-origin:center; transform-box:fill-box; animation: popIn .45s ease-out 0.33s forwards; }
    .tile-2 { opacity:0; transform-origin:center; transform-box:fill-box; animation: popIn .45s ease-out 0.46s forwards; }
    .tile-3 { opacity:0; transform-origin:center; transform-box:fill-box; animation: popIn .45s ease-out 0.59s forwards; }
    .tile-4 { opacity:0; transform-origin:center; transform-box:fill-box; animation: popIn .45s ease-out 0.72s forwards; }
    .tile-5 { opacity:0; transform-origin:center; transform-box:fill-box; animation: popIn .45s ease-out 0.85s forwards; }
    @keyframes growBar { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    .bar-0 { transform:scaleX(0); transform-origin:left center; transform-box:fill-box; animation: growBar 1s ease-out 0.50s forwards; }
    .bar-1 { transform:scaleX(0); transform-origin:left center; transform-box:fill-box; animation: growBar 1s ease-out 0.63s forwards; }
    .bar-2 { transform:scaleX(0); transform-origin:left center; transform-box:fill-box; animation: growBar 1s ease-out 0.76s forwards; }
    .bar-3 { transform:scaleX(0); transform-origin:left center; transform-box:fill-box; animation: growBar 1s ease-out 0.89s forwards; }
    .bar-4 { transform:scaleX(0); transform-origin:left center; transform-box:fill-box; animation: growBar 1s ease-out 1.02s forwards; }
    .bar-5 { transform:scaleX(0); transform-origin:left center; transform-box:fill-box; animation: growBar 1s ease-out 1.15s forwards; }
    @keyframes wob { 0%,100% { transform:rotate(-6deg); } 50% { transform:rotate(6deg); } }
    .t-emoji { transform-origin:center; transform-box:fill-box; animation: wob 3s ease-in-out infinite; }
    @keyframes boostFill { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    .boost-fill { transform:scaleX(0); transform-origin:left center; transform-box:fill-box; animation: boostFill 2.5s ease-out 1.2s forwards; }
    @keyframes rocket { 0%,100% { transform:translate(0,0) rotate(0deg); } 25% { transform:translate(1px,-2px) rotate(4deg); } 75% { transform:translate(-1px,1px) rotate(-4deg); } }
    .rocket { animation: rocket 1.6s ease-in-out infinite; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .boost { opacity:0; animation: fadeIn .6s ease-out 1s forwards; }
    @keyframes hashSpin { 0%,90%,100% { transform:rotate(0deg); } 95% { transform:rotate(12deg); } }
    .hash { transform-origin:center; transform-box:fill-box; animation: hashSpin 5s ease-in-out infinite; }
  </style>
  <rect width="860" height="328" rx="12" fill="#313338" />
  <rect x="0.5" y="0.5" width="859" height="327" rx="11.5" fill="none" stroke="#3F4147" />
