    <text x="824" y="278" text-anchor="end" fill="#949BA4" font-family="'gg sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12">532 contributions · 8-day best streak</text>
    <rect x="72" y="290" width="752" height="8" rx="4" fill="#232428" />
    <rect class="boost-fill" x="72" y="290" width="752" height="8" rx="4" fill="url(#boostGrad)" />
